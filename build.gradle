plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}
version = mod_version
group = 'ru.example.emccrafting'
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neo_version
    runs { client { client() }; server { server() } }
    mods { "${mod_id}" { sourceSet sourceSets.main } }
}

repositories {
    maven { url = 'https://maven.blamejared.com' }           // JEI
    exclusiveContent {                                        // ProjectE
        forRepository { maven { url = 'https://cursemaven.com' } }
        filter { includeGroup 'curse.maven' }
    }
}

dependencies {
    // ВАЖНО: подставь актуальный fileId ProjectE для 1.21.1 NeoForge с CurseForge
    implementation 'curse.maven:projecte-226410:6611984'
    compileOnly 'mezz.jei:jei-1.21.1-neoforge-api:19.21.0.247'
    runtimeOnly 'mezz.jei:jei-1.21.1-neoforge:19.21.0.247'
}
